# ============================================
# AUTHENTICATION
# ============================================

mutation Login($email: String!, $password: String!) {
    login(input: { email: $email, password: $password }) {
        accessToken
        refreshToken
        tokenType
        expiresIn
        user {
            id
            email
            fullName
            role
            employeeId
        }
    }
}

query GetMe {
    me {
        id
        employeeId
        email
        personalEmail
        fullName
        dni
        role
        status
        phone
        address
    }
}

# ============================================
# WORK SCHEDULE
# ============================================

query MySchedule {
    mySchedule {
        id
        userId
        shiftType
        startTime
        endTime
        workingDaysNames
        lateToleranceMinutes
        breakDurationMinutes
        totalHoursPerDay
        isActive
        effectiveFrom
        effectiveUntil
        notes
    }
}

# ============================================
# ATTENDANCE
# ============================================

mutation CheckIn($latitude: Float!, $longitude: Float!, $accuracy: Float!) {
    checkIn(
        input: {
            latitude: $latitude
            longitude: $longitude
            accuracy: $accuracy
            workplaceLatitude: -8.1116778
            workplaceLongitude: -79.0287578
            workplaceRadiusMeters: 100.0
        }
    ) {
        success
        message
        attendanceId
        checkInTime
        isLate
        lateMinutes
        isHoliday
    }
}

mutation CheckOut($latitude: Float!, $longitude: Float!, $accuracy: Float!) {
    checkOut(input: { latitude: $latitude, longitude: $longitude, accuracy: $accuracy }) {
        success
        message
        attendanceId
        checkOutTime
        totalWorkHours
        noBreaksRegistered
    }
}

mutation StartBreak($latitude: Float!, $longitude: Float!, $accuracy: Float!) {
    startBreak(input: { latitude: $latitude, longitude: $longitude, accuracy: $accuracy }) {
        success
        message
        breakId
        startTime
        allowedDurationMinutes
    }
}

mutation EndBreak($latitude: Float!, $longitude: Float!, $accuracy: Float!) {
    endBreak(input: { latitude: $latitude, longitude: $longitude, accuracy: $accuracy }) {
        success
        message
        endTime
        durationMinutes
        isExceeded
    }
}

# ============================================
# MENU
# ============================================



query MonthlyMenu($year: Int!, $month: Int!) {
  menu(year: $year, month: $month) {
    year
    month
    days {
      id
      date
      breakfast
      lunch
      dinner
      isHoliday
    }
  }
}

mutation UploadMonthlyMenu($input: UploadMonthlyMenuInput!) {
  uploadMonthlyMenu(input: $input) {
    status
    message
  }
}

mutation ConfirmOverwriteMonthlyMenu($input: UploadMonthlyMenuInput!) {
  confirmOverwriteMenu(input: $input) {
    status
    message
  }
}

mutation ProposeMenuChange($input: ProposeMenuChangeInput!) {
  proposeMenuChange(input: $input) {
    id
    status
  }
}

